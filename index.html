<meta name="theme-color" content="#1b2333"><title>Chess Studio</title><link rel="stylesheet" href="style.css"></head>
<body>
<main>
  <header><div><h1>Chess Studio</h1><p id="sub">Review, analyze and play</p></div><div class="syncbar"><div id="auth" class="auth"></div><p id="sync" role="status"></p></div></header>
  <nav class="tabs" aria-label="Mode"><button data-mode="review" class="on">Review</button><button data-mode="friend">Friend</button><button data-mode="cpu">Computer</button></nav>
  <div class="layout">
    <section>
      <div id="status" role="status"></div>
      <div id="boardwrap"><div id="board" aria-label="Chess board"></div><div id="promo" hidden></div></div>
      <div class="controls" id="nav">
        <button id="first" aria-label="Start">⏮</button><button id="prev" aria-label="Previous move">◀</button>
        <span id="counter"></span>
        <button id="next" aria-label="Next move">▶</button><button id="last" aria-label="End">⏭</button>
      </div>
      <div class="controls" id="playbar" hidden>
        <button id="undo">Undo</button><button id="flip">Flip</button><button id="newgame">New game</button>
      </div>
      <div id="cpuopts" hidden>
        <label>You play <select id="side"><option value="w">White</option><option value="b">Black</option></select></label>
        <label>Level <select id="level"><option value="easy">Easy</option><option value="mid" selected>Medium</option><option value="hard">Strong</option></select></label>
      </div>
    </section>
    <section class="side">
      <div id="engbox"></div>
      <h2>Moves</h2>
      <div id="moves"></div>
      <div id="why" aria-live="polite"></div>
      <h2 id="note-label">Notes</h2>
      <textarea id="note" rows="3" placeholder="Why was this move played? What would you do?"></textarea>
      <small id="saved"></small>
    </section>
  </div>
  <details>
    <summary>Load or save a game (PGN)</summary>
    <textarea id="pgn" rows="6" placeholder="Paste a PGN here"></textarea>
    <div class="row"><button id="load">Load</button><button id="sample" class="ghost">Sample game</button><button id="save" class="ghost">Save this game</button></div>
    <p id="pgn-err" class="err"></p>
    <div id="games"></div>
  </details>
  <footer>Engine: Stockfish 19 via Stockfish.js 19.0.1 (GPL-3.0). <a href="NOTICE.md">Licence and source</a> · Built with AI assistance.</footer>
</main>
<script type="module" src="app.js"></script>
<script type="module">import {initSync} from "./appsync.js";initSync({app:"chess",keys:["chess-replay-notes-v1","chess-games-v1"],authEl:document.getElementById("auth"),statusEl:document.getElementById("sync")});</script>
</body></html>
